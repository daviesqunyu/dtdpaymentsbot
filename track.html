<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0a0f" />
  <title>Track Order — DTD Store</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="shell">
    <aside class="sidenav" id="sideNav">
      <div class="sidenav-head">

      </div>
      <nav class="sidenav-menu">
        <a href="/" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3 2 -3h5a2 2 0 0 1 2 2z"></path></svg>Store</a>

        <a href="/trade" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>Spot Desk</a>
        <a href="/smtp" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 0.9 2 2v12c0 1.1-0.9 2-2 2H4c-1.1 0-2-0.9-2-2V6c0-1.1 0.9-2 2-2z"></path><polyline points="22 6 12 13 2 6"></polyline></svg>SMTP Vault</a>

      <div class="sidenav-footer">
        <div class="text-xs text-cyber-muted mb-2">Network status</div>
        <div class="flex items-center gap-2"><span style="width:0.5rem;height:0.5rem;background:var(--cyber-neon-green);border-radius:50%;animation:pulse 1.5s infinite"></span><span class="text-cyber-neon-green font-mono text-xs">ONLINE</span></div>

          <a href="/" class="topbar-link">Home</a>
          <a href="/trade" class="topbar-link">Spot Desk</a>

          <button id="btnMenuToggle" class="nav-link" style="padding:0.5rem;background:none;color:var(--cyber-text);font-size:1.5rem">☰</button>
        </div>

      <div id="app" class="content"></div>

  <script src="/js/app.js"></script>
