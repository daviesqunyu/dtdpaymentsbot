<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f3ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bc13fe;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="120" fill="#0a0a0f" stroke="url(#grad)" stroke-width="8"/>
  <path d="M128 48 L256 200 L384 48" stroke="url(#grad)" stroke-width="24" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M192 192 L256 320 L320 192" stroke="#00f3ff" stroke-width="20" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="34" fill="url(#grad)" filter="url(#glow)"/>
  <text x="256" y="430" font-family="Sora, sans-serif" font-size="42" font-weight="800" fill="#00f3ff" text-anchor="middle" letter-spacing="4">₮</text>
</svg>
